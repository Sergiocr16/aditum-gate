name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sintaxis Python
        run: python -m compileall device scripts/validate_configs.py

      - name: Validar configuraciones contra el schema
        run: |
          pip install jsonschema
          python scripts/validate_configs.py

      - name: Tests unitarios
        # Solo lo que importan los tests (flask/requests pinneados como en la
        # flota); evdev/cv2 no hacen falta y no se instalan aqui.
        run: |
          pip install $(grep -E '^(flask|requests|jsonschema)==' device/requirements.txt | tr '\n' ' ')
          python -m unittest discover -s device/tests -t device -v

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis Node
        run: |
          node --check web/server.js
          node --check ecosystem.config.js

      - name: Sintaxis bash
        # Glob y no lista a mano: github-auth.sh y set-github-token.sh se
        # agregaron sin entrar aca, y corren en toda la flota igual que los
        # otros. Un script nuevo queda cubierto sin acordarse de este paso.
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      # El template llega a toda la flota via self-update; un render que no
      # pasa nginx -t alli se restaura y reintenta cada 15 min para siempre,
      # asi que el lugar para atrapar un template roto es aca.
      - name: Sintaxis nginx (template renderizado en ambas variantes)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx
          for port in 3000 8080; do
            sed "s/__UPSTREAM_PORT__/$port/" scripts/nginx/express-aditum-gate.conf.template \
              > /tmp/aditum-site.conf
            printf 'events {}\nhttp { include /tmp/aditum-site.conf; }\n' > /tmp/aditum-nginx.conf
            sudo nginx -t -c /tmp/aditum-nginx.conf
          done

  screen-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build de la pantalla
        run: npm ci && npm run build
        working-directory: web/pedestal-app

      - name: El dist/ commiteado debe estar al dia
        run: |
          git add -A web/pedestal-app/dist
          git diff --cached --quiet -- web/pedestal-app/dist || {
            echo '::error::El build commiteado de la pantalla esta desactualizado. Correr: cd web/pedestal-app && npm ci && npm run build (Node 20) y commitear dist/ en el mismo commit.'
            git diff --cached --stat -- web/pedestal-app/dist
            exit 1
          }
